<!DOCTYPE html>
<!--
  Building Better Worlds Hackathon - materials for participants.
  Every file is stored encrypted (manifest.bin and d/*.bin) and is decrypted in the browser.
  Opening it needs two things: the key at the end of the share link (after #k=) and the six-digit code.
  Neither is stored in this repository. The files are produced by a script that is not part of the site.
-->
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Materials · Building Better Worlds Hackathon</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#23201e">
<link rel="icon" href="../assets/brand/favicon.png" type="image/png">
<link rel="preload" as="font" type="font/woff2" href="../assets/fonts/archivo-black-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="../assets/fonts/jetbrains-mono-latin.woff2" crossorigin>
<style>
@font-face{font-family:"Archivo Black";font-style:normal;font-weight:400;font-display:swap;src:url(../assets/fonts/archivo-black-latin.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400 800;font-display:swap;src:url(../assets/fonts/jetbrains-mono-latin.woff2) format("woff2")}
:root{color-scheme:dark;--ink:#23201e;--ice:#c8f1ff;--brand:#202d85;--soft:rgba(255,255,255,.62);--line:rgba(255,255,255,.18);--red:#ff8d96}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:#fff;font:16px/1.5 "JetBrains Mono",ui-monospace,monospace;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:920px;margin:0 auto;padding:40px 20px 140px}
.mark{display:block;width:min(360px,70%)}
.mark img{display:block;width:100%;height:auto}
h1{margin-top:56px;font:400 clamp(34px,7vw,56px)/1.08 "Archivo Black","Archivo",sans-serif;text-wrap:balance}
.lede{margin-top:16px;max-width:60ch;color:var(--soft)}
h2{margin-top:56px;font:400 clamp(24px,4.6vw,32px)/1.15 "Archivo Black","Archivo",sans-serif}
h2+p{margin-top:10px;max-width:62ch;color:var(--soft)}

form{margin-top:36px;max-width:440px}
label{display:block;font-size:14px;color:var(--soft)}
.code{display:block;width:100%;margin-top:10px;padding:14px 16px;border:2px dashed rgba(200,241,255,.4);border-radius:0;background:rgba(255,255,255,.04);font-size:28px;letter-spacing:.35em}
.link{font-size:15px;letter-spacing:0}
.primary{display:inline-flex;align-items:center;margin-top:16px;padding:14px 28px;border:2px dashed rgba(200,241,255,.4);background:var(--brand);box-shadow:inset 0 0 8px 4px rgba(200,241,255,.3);cursor:pointer;transition:background-color .2s}
.primary:hover{background:#2b3aa6}
.primary:disabled{opacity:.6;cursor:progress}
.error{min-height:1.5em;margin-top:14px;color:var(--red)}

.top{margin-top:20px;list-style:none;border:1px dashed rgba(200,241,255,.4);background:rgba(32,45,133,.35)}
details{margin-top:14px;border:1px dashed var(--line);background:rgba(255,255,255,.03)}
summary{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;padding:16px 18px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";width:1.2em;color:var(--ice)}
details[open]>summary::before{content:"\2212"}
summary:hover{background:rgba(255,255,255,.05)}
.proj{flex:1;font-weight:600;color:var(--ice)}
.meta,.size{font-size:14px;color:var(--soft);white-space:nowrap}
details ul{list-style:none;border-top:1px dashed var(--line)}
li{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-end;gap:6px 16px;padding:11px 18px}
li+li{border-top:1px solid rgba(255,255,255,.07)}
.file{flex:1 1 240px;min-width:0;border:0;background:none;text-align:left;overflow-wrap:anywhere;cursor:pointer}
.file:hover .name{text-decoration:underline;text-underline-offset:3px}
.dir{display:block;font-size:13px;color:var(--soft)}
.save{padding:4px 10px;border:1px solid var(--line);background:none;font-size:13px;color:var(--soft);cursor:pointer}
.save:hover{border-color:var(--ice);color:#fff}
.status{position:fixed;left:0;right:0;bottom:0;padding:14px 20px;border-top:1px dashed rgba(200,241,255,.4);background:#1b1917;font-size:14px}
.status span{display:block;max-width:880px;margin:0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer{margin-top:72px;font-size:14px;color:var(--soft)}
footer a{text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.primary{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><a class="mark" href="../"><img src="../assets/brand/wordmark-wide.svg" alt="Building Better Worlds Hackathon, back to the event page" width="2067" height="350"></a></header>
  <main>
    <h1>Hackathon Materials</h1>

    <section id="gate">
      <p class="lede" id="gate-text">These files are for hackathon participants. Enter the six-digit code to open them.</p>
      <form id="code-form" hidden>
        <label for="code">Six-digit code</label>
        <input class="code" id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" spellcheck="false" required>
        <button class="primary" id="unlock" type="submit">Open the Materials</button>
      </form>
      <form id="link-form" hidden>
        <label for="link">The full link from Discord</label>
        <input class="code link" id="link" name="link" type="text" autocomplete="off" spellcheck="false" required>
        <button class="primary" type="submit">Use This Link</button>
      </form>
      <p class="error" id="error" role="alert"></p>
    </section>

    <section id="content" hidden>
      <p class="lede" id="summary"></p>
      <h2 id="top-title" hidden>Presentation</h2>
      <ul class="top" id="top" hidden></ul>
      <h2>Files by Folder</h2>
      <p>Click a file to open it. Large files take a moment while they are prepared.</p>
      <div id="folders"></div>
    </section>
  </main>
  <footer>Questions go to Discord or <a href="mailto:contact@proximata.io">contact@proximata.io</a>.</footer>
</div>
<div class="status" id="status" role="status" aria-live="polite" hidden><span id="status-text"></span></div>

<script>
(function () {
  'use strict';
  var ITER = 600000;
  var D = document, enc = new TextEncoder(), dec = new TextDecoder();
  function $(id) { return D.getElementById(id); }
  function el(tag, cls, text) { var e = D.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function bytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u;
  }
  function size(n) { return n >= 1e5 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB'; }
  function store(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
  function stored(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function natural(a, b) { return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }); }

  var TYPES = { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', md: 'text/plain;charset=utf-8', txt: 'text/plain;charset=utf-8' };
  var manifest = null, dataKey = null, busy = false;

  function keyFrom(text) { var m = /[#&?]k=([A-Za-z0-9_-]{16,})/.exec(text || ''); return m ? m[1] : null; }
  var linkKey = keyFrom(location.hash) || stored('bbw-k');
  if (linkKey) store('bbw-k', linkKey);

  function fail(msg) { $('error').textContent = msg; }

  async function unlock(code) {
    var res = await fetch('manifest.bin', { cache: 'no-store' });
    if (!res.ok) throw new Error('offline');
    var buf = new Uint8Array(await res.arrayBuffer()), k = bytes(linkKey);
    var salt = new Uint8Array(16 + k.length); salt.set(buf.subarray(0, 16)); salt.set(k, 16);
    var base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
    var kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain;
    try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.subarray(16, 28) }, kek, buf.subarray(28)); }
    catch (e) { throw new Error('wrong'); }
    manifest = JSON.parse(dec.decode(plain));
    dataKey = await crypto.subtle.importKey('raw', bytes(manifest.key), 'AES-GCM', false, ['decrypt']);
  }

  async function read(file, progress) {
    var parts = [];
    for (var i = 0; i < file.c.length; i++) {
      progress(i, file.c.length);
      var res = await fetch('d/' + file.c[i] + '.bin');
      if (!res.ok) throw new Error('offline');
      var b = new Uint8Array(await res.arrayBuffer());
      parts.push(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.subarray(0, 12) }, dataKey, b.subarray(12)));
    }
    var ext = file.p.split('.').pop().toLowerCase();
    return new Blob(parts, { type: TYPES[ext] || 'application/octet-stream' });
  }

  function status(text) { $('status').hidden = !text; $('status-text').textContent = text || ''; }

  async function fetchFile(file, save) {
    var name = file.p.split('/').pop(), ext = name.split('.').pop().toLowerCase();
    if (busy) { status('Still preparing the previous file. One at a time, please.'); return; }
    var tab = !save && TYPES[ext] ? window.open('about:blank', '_blank') : null;
    if (tab) { try { tab.document.title = name; tab.document.body.textContent = 'Preparing ' + name + ' …'; } catch (e) {} }
    busy = true;
    try {
      var blob = await read(file, function (i, n) { status('Preparing ' + name + (n > 1 ? ' (part ' + (i + 1) + ' of ' + n + ')' : '') + ' …'); });
      var url = URL.createObjectURL(blob);
      if (tab && !tab.closed) tab.location.href = url;
      else { var a = el('a'); a.href = url; a.download = name; D.body.appendChild(a); a.click(); a.remove(); }
      setTimeout(function () { URL.revokeObjectURL(url); }, 10 * 60 * 1000);
      status(tab ? '' : 'Saved ' + name + ' to your downloads.');
      if (!tab) setTimeout(function () { if (!busy) status(''); }, 4000);
    } catch (e) {
      if (tab) tab.close();
      status('Could not load ' + name + '. Check your connection and try again.');
    }
    busy = false;
  }

  function row(file, shown) {
    var li = el('li'), name = file.p.split('/').pop(), ext = name.split('.').pop().toLowerCase();
    var b = el('button', 'file'); b.type = 'button';
    var dir = shown.split('/').slice(0, -1).join(' / ');
    if (dir) b.appendChild(el('span', 'dir', dir + ' /'));
    b.appendChild(el('span', 'name', name));
    b.addEventListener('click', function () { fetchFile(file, false); });
    li.appendChild(b);
    li.appendChild(el('span', 'size', size(file.s)));
    if (TYPES[ext]) {
      var s = el('button', 'save', 'Download'); s.type = 'button'; s.setAttribute('aria-label', 'Download ' + name);
      s.addEventListener('click', function () { fetchFile(file, true); });
      li.appendChild(s);
    }
    return li;
  }

  function render() {
    var files = manifest.files.slice().sort(function (a, b) { return natural(a.p, b.p); });
    var total = files.reduce(function (n, f) { return n + f.s; }, 0);
    var top = files.filter(function (f) { return f.p.indexOf('/') < 0; });
    var groups = {};
    files.forEach(function (f) { var i = f.p.indexOf('/'); if (i > 0) (groups[f.p.slice(0, i)] = groups[f.p.slice(0, i)] || []).push(f); });
    $('summary').textContent = files.length + ' files, ' + size(total) + ' in all. Everything opens or downloads straight from this page.';
    if (top.length) {
      $('top-title').hidden = false; $('top').hidden = false;
      top.forEach(function (f) { $('top').appendChild(row(f, f.p)); });
    }
    Object.keys(groups).sort(function (a, b) { return (a !== 'Manual') - (b !== 'Manual') || natural(a, b); }).forEach(function (g) {
      var d = el('details'), s = el('summary'), ul = el('ul'), list = groups[g];
      var bytesIn = list.reduce(function (n, f) { return n + f.s; }, 0);
      s.appendChild(el('span', 'proj', g.replace(/_scanned$/, '')));
      s.appendChild(el('span', 'meta', list.length + (list.length === 1 ? ' file, ' : ' files, ') + size(bytesIn)));
      d.appendChild(s);
      list.forEach(function (f) { ul.appendChild(row(f, f.p.slice(g.length + 1))); });
      d.appendChild(ul);
      if (g === 'Manual') d.open = true;
      $('folders').appendChild(d);
    });
    $('gate').hidden = true; $('content').hidden = false;
  }

  async function tryCode(code, quiet) {
    var btn = $('unlock'); btn.disabled = true; fail('');
    try { await unlock(code); store('bbw-c', code); render(); }
    catch (e) {
      store('bbw-c', null);
      if (!quiet) fail(e.message === 'wrong' ? 'That code does not match this link. Check both and try again.' : 'The files could not be loaded. Check your connection and try again.');
    }
    btn.disabled = false;
  }

  if (!window.crypto || !crypto.subtle) {
    $('gate-text').textContent = 'This browser cannot open the files. Use a current version of Chrome, Edge, Firefox or Safari.';
  } else if (!linkKey) {
    $('gate-text').textContent = 'This link is incomplete. Open the full link that was shared in Discord, or paste it here.';
    $('link-form').hidden = false;
    $('link-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var k = keyFrom($('link').value.trim());
      if (!k) { fail('That is not the full link. It ends in #k= followed by a string of letters and numbers.'); return; }
      store('bbw-k', k); location.hash = 'k=' + k; location.reload();
    });
  } else {
    $('code-form').hidden = false;
    $('code-form').addEventListener('submit', function (e) { e.preventDefault(); tryCode($('code').value.trim(), false); });
    var saved = stored('bbw-c');
    if (saved) tryCode(saved, true);
  }

  window.bbw = { files: function () { return manifest ? manifest.files : null; }, read: read };
})();
</script>
</body>
</html>
